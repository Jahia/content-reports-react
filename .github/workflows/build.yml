name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  # Run on a release tag to build the jar attached to the GitHub release:
  # gh workflow run build.yml --ref content-reports-react-X.Y.Z
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          # Keeps the build machine's path out of the manifest
          JAHIA_DISABLE_SOURCE_FOLDERS: "true"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Jahia_contentReportReact_f27caafa-3684-421f-8783-33756790ae7c -Dsonar.projectName='contentReportReact'
      - name: Check the jar manifest
        run: |
          jar=$(ls target/content-reports-react-*.jar | grep -v -- '-sources.jar')
          if unzip -p "$jar" META-INF/MANIFEST.MF | grep -q 'Jahia-Source-Folders'; then
            echo "::error::$jar carries Jahia-Source-Folders"; exit 1
          fi
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: content-reports-react
          path: |
            target/content-reports-react-*.jar
            !target/content-reports-react-*-sources.jar
